name: Patch notes v81
on:
  push:
    paths:
      - 'scripts/patch_notes_v81.py'
      - '.github/workflows/patch-notes-v81.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run patch script
        run: python3 scripts/patch_notes_v81.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html
          git commit -m "V.Beta.81 - Notas: edicao recolhida, checklist, backspace, undo/redo" || echo nochange
          git push
