name: Patch notes v81
on:
  push:
    paths:
      - '.github/workflows/patch-notes-v81.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply notes fixes
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('app.html')
          t = p.read_text(encoding='utf-8')

          # 1) APP_VERSION
          t = t.replace("const APP_VERSION = 'V.Beta.79';", "const APP_VERSION = 'V.Beta.81';")
          t = t.replace("const APP_VERSION = 'V.Beta.80';", "const APP_VERSION = 'V.Beta.81';")

          # 2) noteResizeChecklistInput - grow with text
          old_resize = """function noteResizeChecklistInput(el){\n  if(!el) return;\n  el.style.setProperty('height','28px','important');\n  el.style.setProperty('min-height','28px','important');\n  el.style.setProperty('max-height','28px','important');\n  el.style.setProperty('line-height','28px','important');\n  el.style.setProperty('overflow','hidden','important');\n  const row = el.closest ? el.closest('.keep-check-edit-row') : null;\n  if(row){\n    row.style.setProperty('height','28px','important');\n    row.style.setProperty('min-height','28px','important');\n    row.style.setProperty('max-height','28px','important');\n    row.style.setProperty('overflow','visible','important');\n  }\n}"""
          new_resize = """function noteResizeChecklistInput(el){\n  if(!el) return;\n  /* V.Beta.81: cresce com o texto — evita sobreposicao */\n  el.style.setProperty('height','auto','important');\n  el.style.setProperty('min-height','28px','important');\n  el.style.setProperty('max-height','none','important');\n  el.style.setProperty('line-height','1.35','important');\n  el.style.setProperty('overflow','hidden','important');\n  el.style.setProperty('white-space','pre-wrap','important');\n  el.style.setProperty('height', Math.max(28, Math.ceil(el.scrollHeight||28))+'px', 'important');\n  const row = el.closest ? el.closest('.keep-check-edit-row') : null;\n  if(row){\n    const h = Math.max(28, Math.ceil(el.getBoundingClientRect().height||el.scrollHeight||28));\n    row.style.setProperty('height', h+'px', 'important');\n    row.style.setProperty('min-height', h+'px', 'important');\n    row.style.setProperty('max-height', 'none', 'important');\n    row.style.setProperty('overflow', 'visible', 'important');\n  }\n}"""
          if old_resize not in t:
            raise SystemExit('noteResizeChecklistInput not found (maybe already patched)')
          t = t.replace(old_resize, new_resize, 1)

          # 3) noteRefreshChecklistDom oninput -> autosize (not lock)
          old_oninput = "input.setAttribute('oninput',`handleNoteEqualsCalc(this);updateChecklistEditLine('${safeId}',${idx},this.value);noteSyncRowEmpty(this);noteResizeChecklistInput(this)`);"
          new_oninput = "input.setAttribute('oninput',`handleNoteEqualsCalc(this);updateChecklistEditLine('${safeId}',${idx},this.value);noteSyncRowEmpty(this);noteAutosizeTextarea(this);noteAutosizeChecklist(this.closest('.keep-check-edit-wrap'));noteHistoryMaybePush('${safeId}')`);"
          if old_oninput in t:
            t = t.replace(old_oninput, new_oninput, 1)
          else:
            # already may have autosize without history
            old_oninput2 = "input.setAttribute('oninput',`handleNoteEqualsCalc(this);updateChecklistEditLine('${safeId}',${idx},this.value);noteSyncRowEmpty(this);noteAutosizeTextarea(this);noteAutosizeChecklist(this.closest('.keep-check-edit-wrap'))`);"
            if old_oninput2 in t:
              t = t.replace(old_oninput2, new_oninput, 1)

          # Also add history push to renderChecklistEditRows oninput
          old_render_oninput = 'oninput="handleNoteEqualsCalc(this);updateChecklistEditLine(\'${safeId}\',${idx},this.value);noteSyncRowEmpty(this);noteAutosizeTextarea(this);noteAutosizeChecklist(this.closest(\'.keep-check-edit-wrap\'))"'
          # The template uses backticks in JS source - match actual file pattern
          old_ri = "oninput=\"handleNoteEqualsCalc(this);updateChecklistEditLine('${safeId}',${idx},this.value);noteSyncRowEmpty(this);noteAutosizeTextarea(this);noteAutosizeChecklist(this.closest('.keep-check-edit-wrap'))\""
          new_ri = "oninput=\"handleNoteEqualsCalc(this);updateChecklistEditLine('${safeId}',${idx},this.value);noteSyncRowEmpty(this);noteAutosizeTextarea(this);noteAutosizeChecklist(this.closest('.keep-check-edit-wrap'));noteHistoryMaybePush('${safeId}')\""
          t = t.replace(old_ri, new_ri)

          # 4) Backspace: only delete empty line; if text+cursor at start, merge up
          old_bs = """  if(key==='Backspace'){\n    const value=String(el.value||''),s=typeof el.selectionStart==='number'?el.selectionStart:value.length,e=typeof el.selectionEnd==='number'?el.selectionEnd:value.length;\n    if(value.length===0||(s===0&&e===0)){\n      ev.preventDefault();ev.stopPropagation();\n      if(wrap&&currentRow&&wrap.children.length>1){\n        const focusIndex=Math.max(0,idx-1);\n        currentRow.remove();noteRefreshChecklistDom(noteId);noteCommitChecklistDomToText(noteId);noteAutosizeChecklist(wrap);\n        const target=wrap.querySelector('.keep-check-edit-row[data-line-index="'+focusIndex+'"] .keep-check-edit-input');\n        if(target){target.focus({preventScroll:true});try{const l=String(target.value||'').length;target.setSelectionRange(l,l);}catch(e){}}\n      }\n    }\n  }\n}"""
          new_bs = """  if(key==='Backspace'){\n    const value=String(el.value||'');\n    const s=typeof el.selectionStart==='number'?el.selectionStart:value.length;\n    const e=typeof el.selectionEnd==='number'?el.selectionEnd:value.length;\n    // Cursor no inicio da linha (sem selecao)
    if(s===0&&e===0){\n      ev.preventDefault();ev.stopPropagation();\n      if(!wrap||!currentRow)return;\n      // Linha vazia: so entao remove (ou via botao X)\n      if(String(value).trim()===''){\n        if(wrap.children.length>1){\n          const focusIndex=Math.max(0,idx-1);\n          currentRow.remove();noteRefreshChecklistDom(noteId);noteCommitChecklistDomToText(noteId);noteAutosizeChecklist(wrap);noteHistoryMaybePush(noteId);\n          const target=wrap.querySelector('.keep-check-edit-row[data-line-index="'+focusIndex+'"] .keep-check-edit-input');\n          if(target){target.focus({preventScroll:true});try{const l=String(target.value||'').length;target.setSelectionRange(l,l);}catch(err){}}\n        }\n        return;\n      }\n      // Linha com texto: une com a de cima (nao apaga)\n      const prev=currentRow.previousElementSibling;\n      if(prev&&prev.classList&&prev.classList.contains('keep-check-edit-row')){\n        const prevInp=prev.querySelector('.keep-check-edit-input');\n        if(prevInp){\n          const prevVal=String(prevInp.value||'');\n          const junction=prevVal.length;\n          prevInp.value=prevVal+value;\n          currentRow.remove();\n          noteRefreshChecklistDom(noteId);noteCommitChecklistDomToText(noteId);noteAutosizeChecklist(wrap);noteHistoryMaybePush(noteId);\n          const target=wrap.querySelector('.keep-check-edit-row[data-line-index="'+(idx-1)+'"] .keep-check-edit-input')||prevInp;\n          if(target){target.focus({preventScroll:true});try{target.setSelectionRange(junction,junction);}catch(err){}}\n        }\n      }\n    }\n  }\n}"""
          if old_bs not in t:
            raise SystemExit('Backspace block not found')
          t = t.replace(old_bs, new_bs, 1)

          # 5) editNote: remove class collapsed when entering edit
          old_edit = "if(n.collapsed){n.collapsed=false;AppState.save();}\n  UI.editingNoteId=id;UI.noteEditLockedHeight=0;UI.noteEditMinHeight=0;\n  const safeId=String(id).replace(/'/g,\"\\\\'\");\n  const article=document.querySelector(`#screen-notas .keep-note[data-note-id=\"${CSS.escape(String(id))}\"]`);\n  if(!article){renderNotes();return;}\n  const title=String(n.titulo||'').trim(), body=String(n.texto||''), isChecklist=isChecklistNoteText(body);\n  article.classList.add('editing');"
          # Simpler replacements
          marker = "if(n.collapsed){n.collapsed=false;AppState.save();}\n  UI.editingNoteId=id;"
          if marker not in t:
            raise SystemExit('editNote collapsed marker not found')
          t = t.replace(
            "if(n.collapsed){n.collapsed=false;AppState.save();}\n  UI.editingNoteId=id;UI.noteEditLockedHeight=0;UI.noteEditMinHeight=0;",
            "if(n.collapsed){n.collapsed=false;AppState.save();}\n  UI.editingNoteId=id;UI.noteEditLockedHeight=0;UI.noteEditMinHeight=0;\n  noteHistoryReset(id, n.titulo, n.texto);",
            1
          )
          t = t.replace(
            "article.classList.add('editing');article.onclick=null;article.setAttribute('onclick','event.stopPropagation()');",
            "article.classList.remove('collapsed');article.classList.add('editing');article.onclick=null;article.setAttribute('onclick','event.stopPropagation()');",
            1
          )

          # 6) noteActionButtons - add undo/redo
          old_save = """  const saveBtn = editing ? `<button class="keep-icon keep-save-inline" type="button" onclick="saveInlineNote('${safeId}',event)" title="Salvar">Salvar</button>` : '';\n  return `<button class="keep-icon ${n.pinned?'active':''}" type="button" onclick="togglePinNote('${safeId}')" title="Fixar">📌</button>"""
          new_save = """  let histBtns='';\n  if(editing){\n    const canU=typeof noteHistoryCanUndo==='function'&&noteHistoryCanUndo(n.id);\n    const canR=typeof noteHistoryCanRedo==='function'&&noteHistoryCanRedo(n.id);\n    if(canR){\n      histBtns=`<button class="keep-icon keep-undo-inline" type="button" onclick="noteHistoryUndo('${safeId}',event)" title="Desfazer">↶</button><button class="keep-icon keep-redo-inline" type="button" onclick="noteHistoryRedo('${safeId}',event)" title="Refazer">↷</button>`;\n    }else if(canU){\n      histBtns=`<button class="keep-icon keep-undo-inline" type="button" onclick="noteHistoryUndo('${safeId}',event)" title="Desfazer">↶</button>`;\n    }\n  }\n  const saveBtn = editing ? `<button class="keep-icon keep-save-inline" type="button" onclick="saveInlineNote('${safeId}',event)" title="Salvar">Salvar</button>` : '';\n  return `${histBtns}<button class="keep-icon ${n.pinned?'active':''}" type="button" onclick="togglePinNote('${safeId}')" title="Fixar">📌</button>"""
          if old_save not in t:
            raise SystemExit('noteActionButtons saveBtn not found')
          t = t.replace(old_save, new_save, 1)

          # 7) Insert history helpers before noteActionButtons
          hist_code = r'''
/* V.Beta.81 - historico desfazer/refazer das notas (estilo Word) */
var noteEditHistory={id:null,undo:[],redo:[],current:null,applying:false,timer:null};
function noteHistoryReset(id,titulo,texto){
  noteEditHistory.id=String(id);
  noteEditHistory.undo=[];
  noteEditHistory.redo=[];
  noteEditHistory.current={titulo:String(titulo||''),texto:String(texto||'')};
  noteEditHistory.applying=false;
  if(noteEditHistory.timer){clearTimeout(noteEditHistory.timer);noteEditHistory.timer=null;}
}
function noteHistoryCanUndo(id){
  return noteEditHistory.id===String(id)&&noteEditHistory.undo.length>0;
}
function noteHistoryCanRedo(id){
  return noteEditHistory.id===String(id)&&noteEditHistory.redo.length>0;
}
function noteHistorySnapshotFromDom(noteId){
  ensureNotas();
  const n=AppState.data.notas.find(x=>String(x.id)===String(noteId));
  if(!n)return null;
  const article=document.querySelector('#screen-notas .keep-note.editing[data-note-id="'+CSS.escape(String(noteId))+'"]');
  let titulo=String(n.titulo||'');
  let texto=String(n.texto||'');
  if(article){
    const ti=article.querySelector('.keep-inline-title');
    if(ti)titulo=String(ti.value||'');
    const live=typeof noteLiveTextFromEditor==='function'?noteLiveTextFromEditor(noteId):null;
    if(live!==null)texto=String(live);
  }
  return {titulo:titulo,texto:texto};
}
function noteHistoryMaybePush(noteId){
  if(noteEditHistory.applying)return;
  if(noteEditHistory.id!==String(noteId))return;
  if(noteEditHistory.timer)clearTimeout(noteEditHistory.timer);
  noteEditHistory.timer=setTimeout(function(){
    noteEditHistory.timer=null;
    const snap=noteHistorySnapshotFromDom(noteId);
    if(!snap)return;
    const cur=noteEditHistory.current;
    if(cur&&cur.titulo===snap.titulo&&cur.texto===snap.texto)return;
    if(cur)noteEditHistory.undo.push(cur);
    if(noteEditHistory.undo.length>40)noteEditHistory.undo.shift();
    noteEditHistory.current=snap;
    noteEditHistory.redo=[];
    noteHistoryRefreshActionButtons(noteId);
  },280);
}
function noteHistoryRefreshActionButtons(noteId){
  ensureNotas();
  const n=AppState.data.notas.find(x=>String(x.id)===String(noteId));
  if(!n)return;
  const article=document.querySelector('#screen-notas .keep-note.editing[data-note-id="'+CSS.escape(String(noteId))+'"]');
  if(!article)return;
  const ag=article.querySelector('.keep-action-group');
  if(ag)ag.innerHTML=noteActionButtons(n,true);
}
function noteHistoryApplyState(noteId,state){
  ensureNotas();
  const n=AppState.data.notas.find(x=>String(x.id)===String(noteId));
  if(!n||!state)return;
  noteEditHistory.applying=true;
  n.titulo=String(state.titulo||'');
  n.texto=String(state.texto||'');
  n.updatedAt=nowIso();
  AppState.save();
  noteEditHistory.current={titulo:n.titulo,texto:n.texto};
  if(typeof noteRebuildEditorInPlace==='function'){
    noteRebuildEditorInPlace(noteId,0);
  }else{
    renderNotes();
  }
  noteEditHistory.applying=false;
  noteHistoryRefreshActionButtons(noteId);
}
function noteHistoryUndo(noteId,ev){
  if(ev){ev.preventDefault();ev.stopPropagation();}
  if(!noteHistoryCanUndo(noteId))return;
  const cur=noteHistorySnapshotFromDom(noteId)||noteEditHistory.current;
  const prev=noteEditHistory.undo.pop();
  if(!prev)return;
  if(cur)noteEditHistory.redo.push(cur);
  noteHistoryApplyState(noteId,prev);
}
function noteHistoryRedo(noteId,ev){
  if(ev){ev.preventDefault();ev.stopPropagation();}
  if(!noteHistoryCanRedo(noteId))return;
  const cur=noteHistorySnapshotFromDom(noteId)||noteEditHistory.current;
  const next=noteEditHistory.redo.pop();
  if(!next)return;
  if(cur)noteEditHistory.undo.push(cur);
  noteHistoryApplyState(noteId,next);
}

'''
          if 'function noteHistoryReset(' not in t:
            anchor = 'function noteActionButtons(n, editing=false){'
            if anchor not in t:
              raise SystemExit('noteActionButtons anchor not found')
            t = t.replace(anchor, hist_code + anchor, 1)

          # 8) Hook history into updateNoteInline if present
          # updateNoteInline likely updates titulo/texto - find and append push
          import re
          m = re.search(r'function updateNoteInline\([^)]*\)\{[^}]{0,400}\}', t)
          # skip complex; use noteHistoryMaybePush from oninput already

          # 9) CSS: editing always shows actions; checklist grows
          css = '''
<style id="vbeta81-notes-fix">
/* V.Beta.81 - nota em edicao nunca fica "recolhida"; checklist cresce; botoes visiveis */
#screen-notas .keep-note.editing.collapsed .keep-note-text,
#screen-notas .keep-note.editing.collapsed .keep-note-meta,
#screen-notas .keep-note.editing.collapsed .keep-actions,
#screen-notas .keep-note.editing .keep-actions{
  display:flex !important;
}
#screen-notas .keep-note.editing{
  height:auto !important;
  min-height:0 !important;
  max-height:none !important;
  overflow:visible !important;
}
#screen-notas .keep-note.editing .keep-check-edit-input{
  height:auto !important;
  min-height:28px !important;
  max-height:none !important;
  line-height:1.35 !important;
  overflow:hidden !important;
  white-space:pre-wrap !important;
  word-break:break-word !important;
}
#screen-notas .keep-note.editing .keep-check-edit-row{
  height:auto !important;
  min-height:28px !important;
  max-height:none !important;
  overflow:visible !important;
  align-items:start !important;
}
#screen-notas .keep-undo-inline,
#screen-notas .keep-redo-inline,
#screen-notas .keep-save-inline{
  display:inline-flex !important;
}
</style>
'''
          if 'vbeta81-notes-fix' not in t:
            if '</head>' in t:
              t = t.replace('</head>', css + '</head>', 1)
            else:
              t = t + css

          # Also patch updateNoteInline oninput paths for title
          t = t.replace(
            "oninput=\"handleNoteEqualsCalc(this);updateNoteInline('${safeId}','titulo',this.value)\"",
            "oninput=\"handleNoteEqualsCalc(this);updateNoteInline('${safeId}','titulo',this.value);noteHistoryMaybePush('${safeId}')\""
          )

          p.write_text(t, encoding='utf-8')
          print('OK patched, len', len(t))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html
          git commit -m "V.Beta.81 - Notas: edicao recolhida, checklist sem sobrepor, backspace une linhas, undo/redo" || echo nochange
          git push
