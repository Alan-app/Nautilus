name: Patch notes checklist
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-notes-checklist.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply minimal notes checklist fix
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('app.html')
          t = p.read_text(encoding='utf-8')
          old1 = """function noteResizeChecklistInput(el){\n  if(!el) return;\n  el.style.setProperty('height','28px','important');\n  el.style.setProperty('min-height','28px','important');\n  el.style.setProperty('max-height','28px','important');\n  el.style.setProperty('line-height','28px','important');\n  el.style.setProperty('overflow','hidden','important');\n  const row = el.closest ? el.closest('.keep-check-edit-row') : null;\n  if(row){\n    row.style.setProperty('height','28px','important');\n    row.style.setProperty('min-height','28px','important');\n    row.style.setProperty('max-height','28px','important');\n    row.style.setProperty('overflow','visible','important');\n  }\n}"""
          new1 = """function noteResizeChecklistInput(el){\n  if(!el) return;\n  /* V.Beta.65: permite crescer com o texto (evita sobreposicao e texto escondido) */\n  el.style.setProperty('height','auto','important');\n  el.style.setProperty('min-height','28px','important');\n  el.style.setProperty('max-height','none','important');\n  el.style.setProperty('line-height','1.35','important');\n  el.style.setProperty('overflow','hidden','important');\n  el.style.setProperty('height', Math.max(28, Math.ceil(el.scrollHeight||28)) + 'px', 'important');\n  const row = el.closest ? el.closest('.keep-check-edit-row') : null;\n  if(row){\n    const h = Math.max(28, Math.ceil(el.getBoundingClientRect().height || el.scrollHeight || 28));\n    row.style.setProperty('height', h + 'px', 'important');\n    row.style.setProperty('min-height', h + 'px', 'important');\n    row.style.setProperty('max-height', 'none', 'important');\n    row.style.setProperty('overflow', 'visible', 'important');\n  }\n}"""
          if old1 not in t:
            raise SystemExit('noteResizeChecklistInput block not found')
          t = t.replace(old1, new1, 1)
          old2 = "input.setAttribute('oninput',`handleNoteEqualsCalc(this);updateChecklistEditLine('${safeId}',${idx},this.value);noteSyncRowEmpty(this);noteResizeChecklistInput(this)`);"
          new2 = "input.setAttribute('oninput',`handleNoteEqualsCalc(this);updateChecklistEditLine('${safeId}',${idx},this.value);noteSyncRowEmpty(this);noteAutosizeTextarea(this);noteAutosizeChecklist(this.closest('.keep-check-edit-wrap'))`);"
          if old2 not in t:
            raise SystemExit('noteRefreshChecklistDom oninput not found')
          t = t.replace(old2, new2, 1)
          # Impede scroll forcado de volta a posicao inicial enquanto digita no checklist
          old3 = """    if(clickViewportY && clickDocY){\n      // Fluxo de nota ja existente: preserva a regra validada da v472.\n      if(clickViewportY <= keyboardTop - 6){\n        const cur = window.scrollY || window.pageYOffset || 0;\n        if(Math.abs(cur - initialScrollY) > 3){\n          window.scrollTo({top: initialScrollY, behavior:'auto'});\n          return true;\n        }\n        return false;\n      }"""
          # try with actual accent characters from file
          old3 = """    if(clickViewportY && clickDocY){\n      // Fluxo de nota j\u00e1 existente: preserva a regra validada da v472.\n      if(clickViewportY <= keyboardTop - 6){\n        const cur = window.scrollY || window.pageYOffset || 0;\n        if(Math.abs(cur - initialScrollY) > 3){\n          window.scrollTo({top: initialScrollY, behavior:'auto'});\n          return true;\n        }\n        return false;\n      }"""
          new3 = """    if(clickViewportY && clickDocY){\n      // V.Beta.65: no checklist, nao forcar scroll de volta a posicao do toque\n      // (isso fazia a linha de cima sumir quando o texto quebrava de linha).\n      const isChecklistInput = !!(el.classList && el.classList.contains('keep-check-edit-input'));\n      if(clickViewportY <= keyboardTop - 6){\n        if(isChecklistInput) return false;\n        const cur = window.scrollY || window.pageYOffset || 0;\n        if(Math.abs(cur - initialScrollY) > 3){\n          window.scrollTo({top: initialScrollY, behavior:'auto'});\n          return true;\n        }\n        return false;\n      }"""
          if old3 not in t:
            # fallback without unicode escape
            old3b = '''    if(clickViewportY && clickDocY){\n      // Fluxo de nota já existente: preserva a regra validada da v472.\n      if(clickViewportY <= keyboardTop - 6){\n        const cur = window.scrollY || window.pageYOffset || 0;\n        if(Math.abs(cur - initialScrollY) > 3){\n          window.scrollTo({top: initialScrollY, behavior:'auto'});\n          return true;\n        }\n        return false;\n      }'''
            if old3b not in t:
              raise SystemExit('noteEnsureInputAboveKeyboard block not found')
            t = t.replace(old3b, new3, 1)
          else:
            t = t.replace(old3, new3, 1)
          # CSS override no final do head (antes de </head> se existir, senao append)
          css = '''<style id="vbeta65-checklist-grow">\n/* V.Beta.65 - checklist: altura automatica, sem sobrepor linhas */\n#screen-notas .keep-check-edit-input{\n  height:auto !important;\n  min-height:28px !important;\n  max-height:none !important;\n  line-height:1.35 !important;\n  overflow:hidden !important;\n  white-space:pre-wrap !important;\n  word-break:break-word !important;\n}\n#screen-notas .keep-check-edit-row{\n  height:auto !important;\n  min-height:28px !important;\n  max-height:none !important;\n  overflow:visible !important;\n  align-items:start !important;\n}\n</style>\n'''
          if 'vbeta65-checklist-grow' not in t:
            if '</head>' in t:
              t = t.replace('</head>', css + '</head>', 1)
            else:
              t = css + t
          p.write_text(t, encoding='utf-8')
          print('OK: app.html patched')
          PY
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "V.Beta.65 - corrige checklist Notas (crescimento de linha sem sobrepor/sumir)"
            git push
          fi
